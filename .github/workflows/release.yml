name: Auto Release & App Builds

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      build_desktop:
        description: "Also build Windows (.exe), macOS (.dmg), and Linux (.AppImage)"
        required: false
        default: false
        type: boolean
      build_ios:
        description: "Also build unsigned iOS (.ipa)"
        required: false
        default: false
        type: boolean
      build_web_bundles:
        description: "Also attach portable Web (.zip / .tar.gz) bundles"
        required: false
        default: false
        type: boolean
      deploy_pages:
        description: "Also deploy live PWA to GitHub Pages"
        required: false
        default: false
        type: boolean

# Flip any flag below to "true" when you are ready to include other platforms on every push.
env:
  ENABLE_ANDROID: "true"
  ENABLE_DESKTOP: "false"
  ENABLE_IOS: "false"
  ENABLE_WEB_BUNDLES: "false"
  ENABLE_PAGES: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release:
    name: Version & Build Web Bundle
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      run_android: ${{ steps.flags.outputs.run_android }}
      run_desktop: ${{ steps.flags.outputs.run_desktop }}
      run_ios: ${{ steps.flags.outputs.run_ios }}
      run_web_bundles: ${{ steps.flags.outputs.run_web_bundles }}
      run_pages: ${{ steps.flags.outputs.run_pages }}

    steps:
      - name: Resolve active build targets
        id: flags
        run: |
          echo "run_android=${ENABLE_ANDROID}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.build_desktop }}" = "true" ] || [ "${ENABLE_DESKTOP}" = "true" ]; then
            echo "run_desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_desktop=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.build_ios }}" = "true" ] || [ "${ENABLE_IOS}" = "true" ]; then
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.build_web_bundles }}" = "true" ] || [ "${ENABLE_WEB_BUNDLES}" = "true" ]; then
            echo "run_web_bundles=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_web_bundles=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.deploy_pages }}" = "true" ] || [ "${ENABLE_PAGES}" = "true" ]; then
            echo "run_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock --no-audit --no-fund
          fi

      - name: Lint and type-check
        run: npm run lint

      - name: Auto-bump version and update version.json
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump || 'auto' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --tags --force
          node scripts/bump-version.mjs

      - name: Build portable & native web bundle (relative paths)
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_BASE_PATH: "./"
          VITE_DISABLE_PWA: "true"
        run: npm run build

      - name: Commit bumped version & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/version.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "Release v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - name: Upload native web bundle for app jobs
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-native
          path: dist/
          retention-days: 1

      - name: Package optional Web bundles
        if: steps.flags.outputs.run_web_bundles == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          mkdir -p release-artifacts
          (cd dist && zip -r "../release-artifacts/tamagotchi-v${VERSION}-web.zip" .)
          tar -czf "release-artifacts/tamagotchi-v${VERSION}-web.tar.gz" -C dist .
          (cd release-artifacts && sha256sum "tamagotchi-v${VERSION}-web.zip" "tamagotchi-v${VERSION}-web.tar.gz" > "tamagotchi-v${VERSION}-checksums.sha256")

      - name: Upload optional Web release assets
        if: steps.flags.outputs.run_web_bundles == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-web
          path: release-artifacts/*
          retention-days: 1

  build-android:
    name: Build Android .apk
    needs: release
    if: needs.release.outputs.run_android == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download compiled web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist-native
          path: mobile/www

      - name: Install Capacitor & configure Android native updater + signing
        working-directory: mobile
        env:
          VERSION: ${{ needs.release.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx cap add android
          npx cap sync android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/custom-release.keystore
            export ANDROID_KEYSTORE_PATH="/tmp/custom-release.keystore"
          fi
          node scripts/configure-android.mjs

      - name: Compile signed Android Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature & stage release asset
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Signed release APK not found at $APK_SRC"
            ls -la mobile/android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_SRC"
          fi
          mkdir -p staged-android
          cp "$APK_SRC" "staged-android/Tamagotchi-v${VERSION}-Android.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-android
          path: staged-android/*.apk
          retention-days: 1

  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    needs: release
    if: needs.release.outputs.run_desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows .exe
            id: windows
            os: windows-latest
            args: --win nsis portable
            ext: exe
          - label: macOS .dmg
            id: macos
            os: macos-latest
            args: --mac dmg
            ext: dmg
          - label: Linux .AppImage
            id: linux
            os: ubuntu-latest
            args: --linux AppImage
            ext: AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download compiled web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist-native
          path: desktop/web

      - name: Sync version and app icon
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cp public/pwa-512x512.png desktop/icon.png
          node -e '
            const fs = require("node:fs");
            const p = "desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install desktop packager dependencies
        working-directory: desktop
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build native installer (${{ matrix.label }})
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }}

      - name: Verify desktop output
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
        run: |
          shopt -s nullglob
          FILES=(desktop/release-out/*.${EXT})
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No *.${EXT} files found in desktop/release-out/"
            ls -la desktop/release-out/ || true
            exit 1
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-desktop-${{ matrix.id }}
          path: desktop/release-out/*.${{ matrix.ext }}
          retention-days: 1

  build-ios:
    name: Build iOS .ipa (Unsigned)
    needs: release
    if: needs.release.outputs.run_ios == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download compiled web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist-native
          path: mobile/www

      - name: Install Capacitor & generate iOS project
        working-directory: mobile
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICON_DIR" ] && [ -f "../public/pwa-512x512.png" ]; then
            for f in "$ICON_DIR"/*.png; do
              [ -f "$f" ] && cp "../public/pwa-512x512.png" "$f"
            done
          fi

      - name: Compile unsigned iOS .ipa
        working-directory: mobile/ios/App
        env:
          VERSION: ${{ needs.release.outputs.version }}
          BUILD_NUM: ${{ github.run_number }}
        run: |
          if [ -d "App.xcworkspace" ]; then
            TARGET_FLAG="-workspace App.xcworkspace"
          else
            TARGET_FLAG="-project App.xcodeproj"
          fi

          xcodebuild $TARGET_FLAG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Compiled .app bundle not found"
            exit 1
          fi

          mkdir -p ipa-staging/Payload "$GITHUB_WORKSPACE/staged-ios"
          cp -R "$APP_PATH" ipa-staging/Payload/
          (cd ipa-staging && zip -r "$GITHUB_WORKSPACE/staged-ios/Tamagotchi-v${VERSION}-iOS-unsigned.ipa" Payload)

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-ios
          path: staged-ios/*.ipa
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [release, build-android, build-desktop, build-ios]
    if: always() && needs.release.result == 'success' && (needs.build-android.result == 'success' || needs.build-desktop.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: final-release

      - name: Create & publish complete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          ls -la final-release/
          shopt -s nullglob
          FILES=(final-release/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No built release assets found to publish"
            exit 1
          fi
          gh release create "$TAG" \
            "${FILES[@]}" \
            --repo "$REPO" \
            --title "Tamagotchi $TAG" \
            --generate-notes \
            --latest

  deploy-pages:
    name: Deploy Live PWA (GitHub Pages)
    needs: release
    if: needs.release.outputs.run_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check if GitHub Pages is enabled
        id: pages-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet. Enable it at https://github.com/${{ github.repository }}/settings/pages (Source: GitHub Actions) to activate live PWA hosting."
          fi

      - name: Checkout tagged release
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.pages-check.outputs.enabled == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock --no-audit --no-fund
          fi

      - name: Configure GitHub Pages
        if: steps.pages-check.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build PWA for GitHub Pages base path
        if: steps.pages-check.outputs.enabled == 'true'
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: steps.pages-check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
